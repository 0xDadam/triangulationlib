[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "delaunay_cpp"
version = "0.1.0"
description = "Delaunay triangulation library"
authors = [{name = "Twoje Imię", email = "email@example.com"}]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "pybind11"
]

[tool.scikit-build]
cmake.minimum-version = "3.15"
cmake.build-type = "Release"
# This passes pybind11 hints to CMake automatically
cmake.args = ["-DPYBIND11_FINDPYTHON=ON"]